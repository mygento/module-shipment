grumphp:
  tasks:
    composer:
      no_check_lock: true
    git_blacklist:
      keywords:
        - 'die('
        - 'var_dump('
        - 'exit;'
    phplint:
    phpcsfixer:
      config: '.php-cs-fixer.php'
    phpmd:
      ruleset: ['vendor/mygento/coding-standard/Mygento-Mage2/phpmd.xml']
      exclude: ['Test']
    phpcs:
      warning_severity: 0
    xmllint:
    phpstan:
      ignore_patterns: ['Test']
      level: 1
